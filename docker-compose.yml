services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: scores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scores}
      POSTGRES_DB: scores
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Migrations are applied by the api at startup (app/migrate.py), one path only: letting Postgres
      # also run them on a new volume applied every file twice and broke fresh installs (2026-09-27).
    ports:
      - "127.0.0.1:5432:5432"   # localhost only, for psql during validation
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scores -d scores"]
      interval: 5s
      retries: 10
    restart: unless-stopped   # come back after a laptop reboot along with the api

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://scores:${POSTGRES_PASSWORD:-scores}@db:5432/scores
      ENABLED_LEAGUES: nfl,ncaaf
      AI_LEAGUES: nfl             # AI text only for these (CTO, 2026-10-01: NFL first; college after real token numbers)
      HEADLINE_LEAGUES: nfl,ncaaf # the Home headlines alone also cover college news (Adam, 2026-10-02)
      AI_GAMES: ncaaf:401856708  # beta (Adam, 2026-10-03): Missouri-Florida gets every AI text; remove after the game
      CACHE_SECONDS: ${CACHE_SECONDS:-30}
      ESPN_BASE: ${ESPN_BASE:-https://site.api.espn.com/apis/site/v2/sports}
      # Phase 4 AI text. Keys come only from the server's .env; with no key every AI section shows its fallback
      # text (the off switch: remove the keys, then `docker compose up -d api worker`).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_QUOTA: db                # the api and the worker share the free-tier quota through Postgres
      TEMPORAL_ADDRESS: temporal:7233   # a page open that runs out of quota hands the text to the worker
    volumes:
      - ./config:/srv/config:ro   # edit favorites without rebuilding
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; the phone reaches it through `tailscale serve`
    # Healthy once it answers: uvicorn serves only after startup has run the migrations, so the worker (which waits
    # for this) never writes to a table a pending migration is about to change (010 adds ai_calls.kind, Oct 2).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  # ---------- Phase 3: Temporal (self-hosted, state in this Postgres: databases temporal + temporal_visibility) ----------
  # Pinned tags, all with linux/arm64 builds (checked with `docker manifest inspect`, 2026-09-28).
  temporal-admin-tools:
    image: temporalio/admin-tools:1.32.0
    environment: &temporal-db
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: db
      POSTGRES_USER: scores
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-scores}
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./temporal/admin-tools.sh:/admin-tools.sh:ro
    entrypoint: ["/bin/sh", "/admin-tools.sh"]
    healthcheck:   # healthy once the schemas are set up; the server waits for it
      test: ["CMD", "test", "-f", "/tmp/schema-ready"]
      interval: 3s
      retries: 100
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/server:1.32.0
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/dynamicconfig.yaml
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    depends_on:
      temporal-admin-tools:
        condition: service_healthy
    ports:
      - "127.0.0.1:7233:7233"   # localhost only: the temporal CLI and tests on this machine
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      start_period: 30s
      retries: 60
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.54.1
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"   # localhost only; other devices reach it with `tailscale serve`
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.temporal.worker"]
    environment:
      DATABASE_URL: postgresql://scores:${POSTGRES_PASSWORD:-scores}@db:5432/scores
      ENABLED_LEAGUES: nfl,ncaaf
      AI_LEAGUES: nfl             # AI text only for these (CTO, 2026-10-01: NFL first; college after real token numbers)
      HEADLINE_LEAGUES: nfl,ncaaf # the Home headlines alone also cover college news (Adam, 2026-10-02)
      AI_GAMES: ncaaf:401856708  # beta (Adam, 2026-10-03): Missouri-Florida gets every AI text; remove after the game
      ESPN_BASE: ${WORKER_ESPN_BASE:-https://site.api.espn.com/apis/site/v2/sports}   # step 3.7 points it at a bad host
      TEMPORAL_ADDRESS: temporal:7233
      # Phase 4 AI text: same keys and shared quota as the api (see there).
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_QUOTA: db
      # The nightly backup's upload target: Object Storage's write-only pre-authenticated URL (ends in /o/), in .env like
      # the keys. Empty = BackupWorkflow fails loudly instead of running (laptop stack: no backups).
      BACKUP_URL: ${BACKUP_URL:-}
    volumes:
      - ./config:/srv/config:ro   # favorites: sync_schedule reads them on every run (no rebuild after an edit)
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy   # the api applies migrations at startup; healthy = they have run
    restart: unless-stopped

volumes:
  pgdata:
